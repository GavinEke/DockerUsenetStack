---
name: mediastack

x-lsio-security: &lsio-security
  user: "13000:13000"
  read_only: true
  security_opt:
    - no-new-privileges=true
  cap_drop:
    - ALL
  tmpfs:
    - /run:uid=13000,gid=13000,exec,mode=0755
    - /tmp:uid=13000,gid=13000,mode=1777
  restart: unless-stopped

services:
  plex:
    <<: *lsio-security
    read_only: false
    image: "lscr.io/linuxserver/plex:latest"
    container_name: plex
    environment:
      TZ: "Australia/Sydney"
      VERSION: "docker"
    volumes:
      - "/srv/media/config/plex:/config"
      - "/srv/media/media:/media:ro"
      - "/srv/media/transcode:/transcode"
    ports:
      - "192.168.1.65:32400:32400/tcp"
    networks:
      seerr_plex: {}
      sonarr_plex: {}
      radarr_plex: {}
      egress_plex:
        gw_priority: 1

  nzbget:
    <<: *lsio-security
    image: "lscr.io/linuxserver/nzbget:latest"
    container_name: nzbget
    environment:
      TZ: "Australia/Sydney"
      UMASK: "002"
    volumes:
      - "/srv/media/config/nzbget:/config"
      - "/srv/media/usenet:/data/usenet"
    ports:
      - "192.168.1.65:6789:6789/tcp"
    networks:
      sonarr_nzbget: {}
      radarr_nzbget: {}
      egress_nzbget:
        gw_priority: 1

  sonarr:
    <<: *lsio-security
    image: "lscr.io/linuxserver/sonarr:latest"
    container_name: sonarr
    environment:
      TZ: "Australia/Sydney"
      UMASK: "002"
    volumes:
      - "/srv/media/config/sonarr:/config"
      - "/srv/media/usenet:/data/usenet"
      - "/srv/media/media/tv:/data/media/tv"
    tmpfs:
      - /run:uid=13000,gid=13000,exec,mode=0755
      - /tmp:uid=13000,gid=13000,mode=1777
      - /data/config:mode=000
      - /data/transcode:mode=000
      - /data/usenet/incomplete:mode=000
      - /data/usenet/nzb:mode=000
      - /data/usenet/queue:mode=000
      - /data/usenet/tmp:mode=000
      - /data/media/movies:mode=000
    ports:
      - "192.168.1.65:8989:8989/tcp"
    networks:
      seerr_sonarr: {}
      prowlarr_sonarr: {}
      sonarr_nzbget: {}
      sonarr_plex: {}
      egress_sonarr:
        gw_priority: 1

  radarr:
    <<: *lsio-security
    image: "lscr.io/linuxserver/radarr:latest"
    container_name: radarr
    environment:
      TZ: "Australia/Sydney"
      UMASK: "002"
    volumes:
      - "/srv/media/config/radarr:/config"
      - "/srv/media/usenet:/data/usenet"
      - "/srv/media/media/movies:/data/media/movies"
    tmpfs:
      - /run:uid=13000,gid=13000,exec,mode=0755
      - /tmp:uid=13000,gid=13000,mode=1777
      - /data/config:mode=000
      - /data/transcode:mode=000
      - /data/usenet/incomplete:mode=000
      - /data/usenet/nzb:mode=000
      - /data/usenet/queue:mode=000
      - /data/usenet/tmp:mode=000
      - /data/media/tv:mode=000
    ports:
      - "192.168.1.65:7878:7878/tcp"
    networks:
      seerr_radarr: {}
      prowlarr_radarr: {}
      radarr_nzbget: {}
      radarr_plex: {}
      egress_radarr:
        gw_priority: 1

  prowlarr:
    <<: *lsio-security
    image: "lscr.io/linuxserver/prowlarr:latest"
    container_name: prowlarr
    environment:
      TZ: "Australia/Sydney"
    volumes:
      - "/srv/media/config/prowlarr:/config"
    ports:
      - "192.168.1.65:9696:9696/tcp"
    networks:
      prowlarr_sonarr: {}
      prowlarr_radarr: {}
      egress_prowlarr:
        gw_priority: 1

  seerr:
    image: "ghcr.io/seerr-team/seerr:latest"
    container_name: seerr
    user: "13000:13000"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    environment:
      TZ: "Australia/Sydney"
      LOG_LEVEL: "info"
      PORT: "5055"
    volumes:
      - "/srv/media/config/seerr:/app/config"
    tmpfs:
      - /tmp:uid=13000,gid=13000,mode=1777
    ports:
      - "127.0.0.1:5055:5055/tcp"
      - "192.168.1.65:5055:5055/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      seerr_plex: {}
      seerr_sonarr: {}
      seerr_radarr: {}
      egress_seerr:
        gw_priority: 1

networks:
  seerr_plex:
    internal: true
  seerr_sonarr:
    internal: true
  seerr_radarr:
    internal: true
  prowlarr_sonarr:
    internal: true
  prowlarr_radarr:
    internal: true
  sonarr_nzbget:
    internal: true
  sonarr_plex:
    internal: true
  radarr_nzbget:
    internal: true
  radarr_plex:
    internal: true

  egress_plex: {}
  egress_seerr: {}
  egress_prowlarr: {}
  egress_sonarr: {}
  egress_radarr: {}
  egress_nzbget: {}
